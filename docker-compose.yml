version: '3.8'



services:

  postgres:

    image: postgres:16-alpine

    container_name: n8n_postgres

    restart: always

    environment:

      - POSTGRES_USER=n8n_user

      - POSTGRES_PASSWORD=TuPasswordSeguroAqui # Cambia esto en producción

      - POSTGRES_DB=n8n_db

    volumes:

      - postgres_data:/var/lib/postgresql/data

    healthcheck:

      test: ["CMD-SHELL", "pg_isready -U n8n_user -d n8n_db"]

      interval: 5s

      timeout: 5s

      retries: 5



  n8n:

    image: docker.n8n.io/n8nio/n8n:latest

    container_name: n8n_automation

    restart: always

    ports:

      - "5678:5678"

    extra_hosts:

      - "host.docker.internal:host-gateway"

    environment:

      - DB_TYPE=postgresdb

      - DB_POSTGRESDB_HOST=postgres

      - DB_POSTGRESDB_PORT=5432

      - DB_POSTGRESDB_DATABASE=n8n_db

      - DB_POSTGRESDB_USER=n8n_user

      - DB_POSTGRESDB_PASSWORD=TuPasswordSeguroAqui

      - WEBHOOK_URL=http://dietpi.local:5678/

      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true

      - N8N_SECURE_COOKIE=false

      - N8N_HOST=dietpi.local

    volumes:

      - n8n_data:/home/node/.n8n

    depends_on:

      postgres:

        condition: service_healthy



volumes:

  postgres_data:

  n8n_data: 

